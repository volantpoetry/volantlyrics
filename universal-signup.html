<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign Up · Volant Lyrics</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #f6f4fc 0%, #edebf5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 2.5rem 2.2rem;
      max-width: 480px;
      width: 100%;
      box-shadow:
        0 30px 60px -20px rgba(0,0,0,0.25),
        0 8px 24px rgba(0,0,0,0.04),
        inset 0 1px 0 rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.2s ease;
    }

    .platform-badge {
      display: inline-block;
      padding: 0.45rem 1.2rem;
      border-radius: 60px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #6a1b9a, #9c27b0);
      color: white;
      margin-bottom: 1.2rem;
      box-shadow: 0 4px 8px rgba(75, 42, 173, 0.15);
    }

    h2 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1d1a2b;
      margin: 0.2rem 0 0.2rem;
    }
    .subtitle {
      color: #6b677a;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      font-weight: 400;
      border-left: 3px solid #9c27b0;
      padding-left: 0.8rem;
      border-radius: 0 4px 4px 0;
    }

    .google-btn {
      width: 100%;
      padding: 0.9rem;
      border: 2px solid #e4e0ed;
      border-radius: 40px;
      background: #ffffff;
      color: #1d1a2b;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      margin-bottom: 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }
    .google-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 42px;
      padding: 2px;
      background: linear-gradient(135deg, #4285f4, #ea4335, #fbbc05, #34a853);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .google-btn:hover:not(:disabled)::before { opacity: 0.4; }
    .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .google-btn i { font-size: 1.2rem; color: #4285f4; }

    .divider-text {
      text-align: center;
      margin: 1rem 0 1.2rem;
      color: #bfbad0;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
      position: relative;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30%;
      height: 1px;
      background: #e4e0ed;
    }
    .divider-text::before { left: 0; }
    .divider-text::after { right: 0; }

    form label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #2b263b;
      margin: 1.2rem 0 0.35rem;
      letter-spacing: 0.2px;
    }
    label:first-of-type { margin-top: 0; }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1.5px solid #e4e0ed;
      border-radius: 18px;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.5);
      outline: none;
      font-family: 'Inter', sans-serif;
      color: #1d1a2b;
      transition: 0.2s;
    }
    input:focus {
      border-color: #9c27b0;
      box-shadow: 0 0 0 4px rgba(156, 39, 176, 0.08);
      background: white;
    }
    input::placeholder { color: #b2adc4; font-weight: 400; }

    .password-wrapper { position: relative; width: 100%; }
    .password-eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.1rem;
      user-select: none;
      color: #9a94af;
      padding: 4px 6px;
      border-radius: 30px;
      transition: 0.15s;
      line-height: 1;
    }
    .password-eye:hover { background: rgba(156, 39, 176, 0.06); color: #9c27b0; }
    .password-eye.showing { color: #9c27b0; background: rgba(156, 39, 176, 0.08); }

    .recaptcha-container {
      display: flex;
      justify-content: center;
      margin: 1.2rem 0 0.5rem;
    }
    .recaptcha-container > div { transform: scale(0.92); transform-origin: center; }

    .btn-primary {
      width: 100%;
      padding: 0.95rem;
      margin-top: 1.2rem;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #6a1b9a, #9c27b0);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(156, 39, 176, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
    }
    .btn-primary:hover:not(:disabled) { background: #7b1fa2; transform: scale(1.01); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; box-shadow: none; }

    .status {
      margin-top: 1.2rem;
      padding: 0.8rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      display: none;
      font-weight: 500;
      background: #f5f3fa;
      border: 1px solid transparent;
    }
    .status.show { display: block; }
    .status.success { background: #eaf6ed; color: #1f6b44; border-color: #b7dfc9; }
    .status.error { background: #fdeded; color: #b33c3c; border-color: #f5d0d0; }
    .status.info { background: #e8edfd; color: #2a4a9e; border-color: #c8d4f5; }

    .account-check {
      background: rgba(245, 242, 252, 0.5);
      padding: 1rem;
      border-radius: 30px;
      margin-top: 1.8rem;
      text-align: center;
      font-size: 0.9rem;
      border: 1px solid rgba(75, 42, 173, 0.04);
    }
    .account-check a { color: #9c27b0; font-weight: 600; text-decoration: none; border-bottom: 1.5px dotted transparent; }
    .account-check a:hover { border-bottom-color: #9c27b0; }

    .spinner {
      border: 2.5px solid rgba(255,255,255,0.2);
      border-top: 2.5px solid white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 500px) {
      .container { padding: 1.8rem 1.4rem; border-radius: 28px; }
      h2 { font-size: 1.6rem; }
      .recaptcha-container > div { transform: scale(0.78); }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="platform-badge" id="platformBadge">Volant Lyrics</div>
  <h2>Create your account</h2>
  <p class="subtitle">Join Volant Lyrics — sell your lyrics, buy great ones.</p>

  <button id="googleSignInBtn" class="google-btn">
    <i class="fab fa-google"></i>
    <span class="google-text">Continue with Google</span>
  </button>

  <div class="divider-text">or create with email</div>

  <form id="signup-form">
    <label for="signup-name">Full name</label>
    <input type="text" id="signup-name" placeholder="How you want to be known" autocomplete="name" maxlength="50">

    <label for="signup-email">Email address</label>
    <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">

    <label for="signup-password">Password</label>
    <div class="password-wrapper">
      <input type="password" id="signup-password" placeholder="At least 8 characters" autocomplete="new-password">
      <span id="toggle-password" class="password-eye"><i class="far fa-eye"></i></span>
    </div>

    <div class="recaptcha-container">
      <div class="g-recaptcha" data-sitekey="6LfEe3wtAAAAACMvQc1vCwhgMtwvrH562PtKuXTU" data-callback="onRecaptchaSuccess"></div>
    </div>

    <button type="submit" class="btn-primary" id="signup-button" disabled>
      <span id="buttonText">Create Account</span>
    </button>
  </form>

  <div id="signup-status" class="status"></div>

  <div class="account-check">
    <span>Already have an account? </span>
    <a href="#" id="goToLogin">Sign in</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
  let recaptchaVerified = false;

  function onRecaptchaSuccess() {
    recaptchaVerified = true;
    document.getElementById('signup-button').disabled = false;
  }
  function onRecaptchaExpired() {
    recaptchaVerified = false;
    document.getElementById('signup-button').disabled = true;
  }

  function showStatus(message, type) {
    const el = document.getElementById('signup-status');
    el.textContent = message;
    el.className = 'status show ' + (type || 'error');
  }

  const firebaseConfig = {
    apiKey: "AIzaSyC4DHI8aBVY4JjTvJ-r-TGIDPsewtEWxzU",
    authDomain: "silent-depth.firebaseapp.com",
    projectId: "silent-depth",
    storageBucket: "silent-depth.firebasestorage.app",
    messagingSenderId: "78008755450",
    appId: "1:78008755450:web:3fd0f0f298a08820935543",
    measurementId: "G-WSWDCB7KD8"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const urlParams = new URLSearchParams(window.location.search);
  const platform = urlParams.get('platform') || 'lyrics';
  let redirectParam = urlParams.get('redirect');

  function cleanRedirect() {
    let r = redirectParam;
    if (r) { try { r = decodeURIComponent(r); } catch (e) {} }
    const badPages = ['login', 'signup', 'verify', 'reset', 'check-verification'];
    if (!r || badPages.some(p => r.includes(p)) || r.startsWith('http')) return 'index.html';
    if (r.charAt(0) === '/') r = r.substring(1);
    return r || 'index.html';
  }

  function redirectAfterLogin() {
    sessionStorage.removeItem('returnUrl');
    sessionStorage.removeItem('preLoginPage');
    localStorage.removeItem('returnUrl');
    window.location.href = cleanRedirect();
  }

  function copyAuthQuery(target) {
    const params = new URLSearchParams();
    params.append('platform', platform);
    if (redirectParam) params.append('redirect', redirectParam);
    return target + '?' + params.toString();
  }

  async function isUsernameTaken(username) {
    if (!username || username.length < 3) return false;
    try {
      const snap = await db.collection('users').where('username', '==', username).get();
      return !snap.empty;
    } catch (e) { return false; }
  }

  async function generateUniqueUsername(baseName) {
    if (!baseName || baseName.length < 3) baseName = 'user';
    let clean = baseName.replace(/\s/g, '_').toLowerCase().replace(/[^a-z0-9_]/g, '').substring(0, 11);
    if (!clean || clean.length < 3) clean = 'user_' + Math.random().toString(36).substring(2, 6);
    if (!(await isUsernameTaken(clean))) return clean;
    let counter = 1;
    let newUsername;
    do {
      const suffix = counter.toString();
      const base = clean.substring(0, 11 - suffix.length);
      newUsername = base + suffix;
      counter++;
      if (counter > 100) break;
    } while (await isUsernameTaken(newUsername));
    return newUsername || clean + '_' + Date.now().toString(36);
  }

  async function ensureUserDoc(user, provider, displayName) {
    const ref = db.collection('users').doc(user.uid);
    const snap = await ref.get();
    if (!snap.exists) {
      let uname = await generateUniqueUsername(displayName || user.displayName || user.email || 'user');
      await ref.set({
        username: uname,
        email: user.email,
        displayName: displayName || user.displayName || uname,
        photoURL: user.photoURL || '',
        createdAt: new Date().toISOString(),
        platform: 'lyrics',
        emailVerified: user.emailVerified || false,
        authProvider: provider,
        lastLogin: new Date().toISOString(),
        isVerified: true
      });
      return uname;
    }
    return snap.data().username || user.displayName || 'User';
  }

  // ===== GOOGLE SIGN-UP =====
  let isGoogleSignInProgress = false;
  async function signInWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const btn = document.getElementById('googleSignInBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';
    isGoogleSignInProgress = true;
    try {
      showStatus('Connecting to Google...', 'info');
      let result;
      try {
        result = await auth.signInWithPopup(provider);
      } catch (pe) {
        if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(pe.code)) {
          await auth.signInWithRedirect(provider);
          return;
        }
        throw pe;
      }
      await ensureUserDoc(result.user, 'google');
      showStatus('Account ready! Redirecting...', 'success');
      isGoogleSignInProgress = false;
      redirectAfterLogin();
    } catch (error) {
      console.error('Google sign-up error:', error);
      let msg = 'Google sign-in failed. Please try again.';
      if (error.code === 'auth/account-exists-with-different-credential') {
        msg = 'An account already exists with this email. Please sign in with your password instead.';
      } else if (error.code === 'auth/popup-closed-by-user') {
        msg = 'Sign-up cancelled. Please try again.';
      }
      showStatus('' + msg, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fab fa-google"></i><span class="google-text">Continue with Google</span>';
      isGoogleSignInProgress = false;
    }
  }
  document.getElementById('googleSignInBtn').addEventListener('click', signInWithGoogle);

  // ===== EMAIL SIGN-UP =====
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!recaptchaVerified) {
      showStatus('Please complete the reCAPTCHA verification.', 'error');
      return;
    }

    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const btn = document.getElementById('signup-button');
    const btnText = document.getElementById('buttonText');

    if (!name || name.length < 2) { showStatus('Please enter your full name.', 'error'); return; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showStatus('Please enter a valid email address.', 'error'); return; }
    if (password.length < 8) { showStatus('Password must be at least 8 characters.', 'error'); return; }

    btn.disabled = true;
    btnText.textContent = 'Creating account...';

    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const user = cred.user;
      await user.updateProfile({ displayName: name });

      await ensureUserDoc(user, 'password', name);

      let settings;
      if (location.protocol !== 'file:') {
        settings = {
          url: location.origin + '/universal-login.html?platform=lyrics&redirect=' + encodeURIComponent(cleanRedirect())
        };
      }
      await user.sendEmailVerification(settings);

      await auth.signOut();
      showStatus('Account created! A verification link was sent to your email. Verify it, then sign in.', 'success');
      btnText.textContent = 'Create Account';

      const goLogin = document.createElement('button');
      goLogin.className = 'go-login-btn';
      goLogin.style.cssText = 'margin-top:12px;background:none;border:1px solid #9c27b0;color:#9c27b0;padding:8px 16px;border-radius:30px;font-weight:600;font-size:0.85rem;cursor:pointer;font-family:Inter,sans-serif;';
      goLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i> Go to Sign In';
      goLogin.addEventListener('click', () => { window.location.href = copyAuthQuery('universal-login.html'); });
      document.getElementById('signup-status').appendChild(goLogin);

    } catch (err) {
      console.error('Sign-up error:', err);
      let msg = '' + err.message;
      if (err.code === 'auth/email-already-in-use') msg = 'This email is already registered. Please sign in instead.';
      else if (err.code === 'auth/weak-password') msg = 'Password is too weak. Use at least 8 characters.';
      else if (err.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
      showStatus(msg, 'error');
      btn.disabled = false;
      btnText.textContent = 'Create Account';
    }
  });

  // ===== LINKS =====
  document.getElementById('toggle-password').addEventListener('click', function() {
    const pw = document.getElementById('signup-password');
    const showing = pw.type === 'password';
    pw.type = showing ? 'text' : 'password';
    this.classList.toggle('showing', showing);
    this.innerHTML = showing ? '<i class="fas fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
  });

  document.getElementById('goToLogin').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = copyAuthQuery('universal-login.html');
  });

  // ===== ALREADY SIGNED IN? (verified) =====
  let isRedirecting = false;
  auth.onAuthStateChanged((user) => {
    if (isGoogleSignInProgress || isRedirecting) return;
    if (user && user.emailVerified) {
      isRedirecting = true;
      redirectAfterLogin();
    }
  });
</script>
</body>
</html>
